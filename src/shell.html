<!--@HEAD-->
<title>גן סינדרלה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="גן סינדרלה, אשדוד · גן ילדים מהאגדות · דמו של אתר ומערכת">
<meta name="theme-color" content="#FFFAFC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@600..900&family=Rubik:wght@400..700&display=swap">
<style>
/*@CSS*/
</style>
<!--@/HEAD-->
<!--@ICONS-->
<a class="skip" href="#main" data-i18n="core.skip">דילוג לתוכן</a>

<header class="topbar" role="banner">
  <div class="wrap topbar__in">
    <a class="brand" href="#visitors" aria-label="גן סינדרלה" data-i18n-attr="aria-label:core.brand">
      <span class="brand__logo" data-logo></span>
      <span class="brand__name" data-i18n="core.brand">גן סינדרלה</span>
    </a>
    <span class="demo-plaque"><i aria-hidden="true"></i><span data-i18n="core.demo">דמו · נתונים לדוגמה</span></span>
    <div class="topbar__actions">
      <button type="button" class="tb-btn tb-btn--tour" data-tour-start data-magnetic>
        <svg class="ic ic--fill" aria-hidden="true"><use href="#i-play"/></svg><span data-i18n="core.tourBtn">סיור בדמו</span>
      </button>
      <button type="button" class="tb-btn tb-btn--lang" data-lang-toggle data-i18n-attr="aria-label:core.langA11y" aria-label="Переключить на русский">
        <span data-i18n="core.langBtn">RU</span>
      </button>
      <button type="button" class="tb-btn tb-btn--icon" data-a11y-open data-i18n-attr="aria-label:core.a11yBtn" aria-label="תפריט נגישות">
        <svg class="ic" aria-hidden="true"><use href="#i-a11y"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <section class="view" data-view="visitors" aria-label="מבקרים חדשים" data-i18n-attr="aria-label:core.dock.visitors">
    <div data-module="pubTop"><!--@MODULE:pubTop--></div>
    <div data-module="pubBottom"><!--@MODULE:pubBottom--></div>
  </section>
  <section class="view" data-view="parents" aria-label="הורים" data-i18n-attr="aria-label:core.dock.parents" hidden>
    <div data-module="parent"><!--@MODULE:parent--></div>
  </section>
  <section class="view" data-view="staff" aria-label="צוות" data-i18n-attr="aria-label:core.dock.staff" hidden>
    <div data-module="staff"><!--@MODULE:staff--></div>
  </section>
  <section class="view" data-view="owner" aria-label="הנהלה" data-i18n-attr="aria-label:core.dock.owner" hidden>
    <div data-module="owner"><!--@MODULE:owner--></div>
  </section>
</main>

<div class="tour-invite" hidden>
  <button type="button" class="tour-invite__btn" data-tour-start data-magnetic>
    <span class="play"><svg class="ic ic--fill" aria-hidden="true"><use href="#i-play"/></svg></span>
    <span data-i18n="core.invite">סיור בדמו · דקה וחצי</span>
  </button>
  <button type="button" class="tour-invite__x" data-invite-x data-i18n-attr="aria-label:core.inviteX" aria-label="לא עכשיו">
    <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
  </button>
</div>

<nav class="dock" aria-label="בחירת תצוגה" data-i18n-attr="aria-label:core.dock.label">
  <div class="dock__bar">
    <span class="dock__ind" aria-hidden="true"></span>
    <button type="button" class="dock__btn" data-go="visitors" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#i-castle"/></svg><span data-i18n="core.dock.visitors">מבקרים חדשים</span></button>
    <button type="button" class="dock__btn" data-go="parents"><svg class="ic" aria-hidden="true"><use href="#i-home-heart"/></svg><span data-i18n="core.dock.parents">הורים</span></button>
    <button type="button" class="dock__btn" data-go="staff"><svg class="ic" aria-hidden="true"><use href="#i-tablet"/></svg><span data-i18n="core.dock.staff">צוות</span></button>
    <button type="button" class="dock__btn" data-go="owner"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg><span data-i18n="core.dock.owner">הנהלה</span></button>
  </div>
</nav>

<div class="tour-shield" hidden></div>
<div class="tour-cap" hidden role="status" aria-live="polite">
  <div class="tour-cap__card">
    <p class="tour-cap__text"></p>
    <button type="button" class="tour-cap__stop"><svg class="ic" aria-hidden="true"><use href="#i-stop"/></svg><span data-i18n="core.tour.stop">עצירה</span></button>
    <div class="tour-cap__bar" aria-hidden="true"></div>
    <p class="tour-cap__hint" data-i18n="core.tour.hint">נגיעה במסך עוצרת את הסיור</p>
  </div>
</div>
<div class="ghost-finger" hidden aria-hidden="true"></div>
<div class="pixie" hidden aria-hidden="true"><div class="pixie__bloom"></div><div class="pixie__ring"></div></div>
<canvas class="fx-canvas" aria-hidden="true"></canvas>
<div class="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
/*@JS*/
</script>
